<ion-header class="ion-no-border">
  <div class="thr-set-hdr">
    <button class="thr-icon-btn" (click)="goHome()" aria-label="Back">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
    <span class="thr-set-title">Settings</span>
  </div>
</ion-header>

<ion-content class="ion-padding">
  <div class="thr-set-group">
    <button class="thr-set-row" (click)="toggleDark()" role="switch" [attr.aria-checked]="lstoreSvc.darkMode()">
      <ion-icon name="moon-outline" class="thr-set-icon"></ion-icon>
      <span class="thr-set-text">Dark mode</span>
      <span class="thr-toggle" [class.thr-toggle-on]="lstoreSvc.darkMode()"><span class="thr-toggle-knob"></span></span>
    </button>
    <button class="thr-set-row" (click)="showHowTo.set(true)">
      <ion-icon name="help-circle-outline" class="thr-set-icon"></ion-icon>
      <span class="thr-set-text">How to play</span>
      <ion-icon name="chevron-forward" class="thr-set-chev"></ion-icon>
    </button>
  </div>

  <div class="thr-set-group">
    @if (lstoreSvc.adFree()) {
    <div class="thr-set-row thr-set-static">
      <ion-icon name="checkmark-circle" class="thr-set-icon thr-set-ok"></ion-icon>
      <span class="thr-set-text">Ads removed — thank you!</span>
    </div>
    } @else {
    <button class="thr-set-row" (click)="removeAds()" [disabled]="purchasing()">
      <ion-icon name="ban-outline" class="thr-set-icon thr-set-danger"></ion-icon>
      <span class="thr-set-text">
        Remove ads
        <span class="thr-set-sub">No more ads between puzzles. Reward ads stay optional.</span>
      </span>
      @if (purchaseSvc.removeAdsPrice(); as price) {<span class="thr-set-price">{{ price }}</span>}
    </button>
    }
    <button class="thr-set-row" (click)="restore()" [disabled]="purchasing()">
      <ion-icon name="refresh-outline" class="thr-set-icon"></ion-icon>
      <span class="thr-set-text">Restore purchases</span>
    </button>
  </div>

  <div class="thr-set-group">
    <button class="thr-set-row" (click)="openPrivacy()">
      <ion-icon name="shield-checkmark-outline" class="thr-set-icon"></ion-icon>
      <span class="thr-set-text">Privacy policy</span>
      <ion-icon name="chevron-forward" class="thr-set-chev"></ion-icon>
    </button>
  </div>

  <div class="thr-set-group">
    <button class="thr-set-row" (click)="boardTest()">
      <ion-icon name="grid-outline" class="thr-set-icon"></ion-icon>
      <span class="thr-set-text">
        Board size test
        <span class="thr-set-sub">Free practice boards from 2×4 up to 5×4. No energy, no coins.</span>
      </span>
      <ion-icon name="chevron-forward" class="thr-set-chev"></ion-icon>
    </button>
  </div>

  <p class="thr-set-footer">Threadily · bigSIMPLE Games</p>

  @if (showHowTo()) {
  <div class="thr-howto-backdrop" (click)="showHowTo.set(false)">
    <div class="thr-howto" role="dialog" aria-label="How to play" (click)="$event.stopPropagation()">
      <h2 class="thr-howto-title">How to play</h2>
      <p class="thr-howto-lede">Every puzzle shows its categories up front. Sort every tile into the right one.</p>
      @for (s of steps; track s.title) {
      <div class="thr-howto-step">
        <span class="thr-howto-icon">{{ s.icon }}</span>
        <span>
          <strong>{{ s.title }}</strong>
          <span class="thr-howto-body">{{ s.body }}</span>
        </span>
      </div>
      }
      <div class="thr-howto-actions">
        <button class="thr-btn thr-btn-primary" (click)="showHowTo.set(false)">Got it</button>
        <button class="thr-btn thr-btn-ghost" (click)="replayTutorial()">Replay the tutorial</button>
      </div>
    </div>
  </div>
  }
</ion-content>
